<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>TNG Boxing · Unity</title><style>html,body{margin:0;background:#070b12;color:white;height:100%;font:16px system-ui;overflow:hidden}canvas{width:100%;height:100%;display:block;touch-action:none}#loading{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:#070b12}progress{accent-color:#e52b49}#error{max-width:36rem;padding:1rem}</style></head><body><canvas id="unity-canvas" tabindex="0" aria-label="TNG Boxing Unity game"></canvas><div id="loading"><h1>TNG BOXING</h1><p id="status">Loading the Unity arena…</p><progress max="1" value="0"></progress><div id="error" role="alert"></div></div><script>
const canvas=document.getElementById('unity-canvas'),loading=document.getElementById('loading');
function fail(message){document.getElementById('status').textContent='The Unity arena could not start.';document.getElementById('error').textContent=message;}
const script=document.createElement('script');script.src='Build/{{{ LOADER_FILENAME }}}';script.onerror=()=>fail('Unable to load game files. Reload or return to TNGOS.');script.onload=()=>createUnityInstance(canvas,{dataUrl:'Build/{{{ DATA_FILENAME }}}',frameworkUrl:'Build/{{{ FRAMEWORK_FILENAME }}}',codeUrl:'Build/{{{ CODE_FILENAME }}}',streamingAssetsUrl:'StreamingAssets',companyName:'TNG Boxing',productName:'TNG Boxing Arena',productVersion:'0.1.0',showBanner:(message,type)=>{if(type==='error')fail(message);}},p=>document.querySelector('progress').value=p).then(instance=>{window.tngUnity=instance;loading.remove();canvas.focus();}).catch(e=>fail(String(e)));document.body.appendChild(script);
window.addEventListener('pagehide',()=>window.tngUnity?.Quit());
</script></body></html>
